<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZ华文复习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly study adventure for 11-year-olds; learning first, battle as the reward layer
   IDEA: the 田字格 exercise book: levels are grid squares, monsters are "字怪" defeated by correct answers
   PICTURE: the hero card and the level map; in activities, a small battle arena above the question
   COLOUR and TYPE: exercise-book cover blue, white paper, 田字格 red; Noto Sans SC + 楷体 for characters
   LAYOUT: cover band, map + hero side by side, activities full width with arena on top */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121519);--ink:light-dark(#1b2230,#e8ecf1);--muted:light-dark(#5b6472,#9aa4b1);
--cover:light-dark(#1f4e79,#1a3c5e);--cover-ink:#f4f7fb;--red:light-dark(#cf3e35,#ef6a5f);--gold:light-dark(#b7861b,#e9b949);
--grid:light-dark(#f1c4bf,#5a3330);--soft:light-dark(#f4f6f9,#1b2027);--line:light-dark(#dfe3e9,#2c333d);
--ok:light-dark(#2b7a4b,#5cc48a);--okbg:light-dark(#e8f5ed,#18301f);--badbg:light-dark(#fcebea,#3a1d1b);--partbg:light-dark(#fff6e0,#33291a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow-x:clip}
.kai{font-family:"KaiTi","STKaiti","Kaiti SC","BiauKai","Noto Serif SC",serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 16px}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.pri{background:var(--cover);color:var(--cover-ink);border-color:var(--cover);font-weight:500}
.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.tog[aria-pressed=true]{background:var(--soft);border-color:var(--cover);font-weight:500}
button:disabled{opacity:.45;cursor:default}
input[type=text],textarea{font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%}
.band{padding:clamp(20px,3.5vw,48px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header.cover{background:var(--cover);color:var(--cover-ink)}
header .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:clamp(24px,3.4vw,36px);line-height:1.1;font-weight:700}
header h1 small{display:block;font-size:15px;font-weight:400;opacity:.8;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--cover-ink);border-radius:999px;padding:6px 14px;font-size:14px;min-height:40px}
h2{font-size:22px;line-height:1.2;margin:0 0 14px}
h3{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted)}.note{font-size:13px;color:var(--muted)}
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px}
@media(max-width:860px){.home{grid-template-columns:minmax(0,1fr)}}
.map{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media(max-width:520px){.map{gap:5px}.cell{padding:2px}.cell b{font-size:15px}.cell span{display:none}}
.cell{position:relative;aspect-ratio:1;border:2px solid var(--red);border-radius:6px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;overflow:hidden}
.cell::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat;pointer-events:none}
.cell .fill{position:absolute;left:0;right:0;bottom:0;background:light-dark(#fbe3e0,#3a2321);transition:height .5s}
.cell b{position:relative;font-size:clamp(22px,3.2vw,36px);white-space:nowrap;line-height:1;font-weight:600}
.cell span{position:relative;font-size:13px;color:var(--muted);margin-top:8px}
.cell.off{border-style:dashed;opacity:.55;cursor:default}
.cell.next{box-shadow:0 0 0 4px light-dark(#f8d3cf,#4d2a27)}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--bg)}
.next-card{background:var(--soft);border:0}
.next-card .t{font-size:20px;font-weight:700;margin:4px 0}
.meter{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--cover);transition:width .5s}
.meter.xp i{background:var(--gold)}
.skill{display:grid;grid-template-columns:4.5em minmax(0,1fr) 3.5em;gap:10px;align-items:center;margin:10px 0;font-size:15px}
.skill em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.hero-card{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
.hero-card svg{width:120px;height:120px;overflow:visible}
.hero-card .nm{font-size:22px;font-weight:700}
.stat{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:6px 0}
.upg{display:grid;gap:8px;margin-top:8px}
.upr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.upr button{min-width:72px}
.gear{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gear span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}
.gear span.got{border-color:var(--gold);color:var(--gold);font-weight:500}
.stars{color:var(--red);letter-spacing:2px;white-space:nowrap}.stars .e{color:var(--line)}
.lessons{display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:64px 5.5em minmax(0,1fr) auto auto auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.lesson .chars{font-size:20px;letter-spacing:2px;overflow-wrap:anywhere}
.lesson .mini svg{width:56px;height:56px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px}
.act button{width:100%;padding:6px 10px}
@media(max-width:640px){.lesson{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}.lesson .mini{grid-column:1}.lesson>strong{grid-column:2/-1}.lesson .chars{grid-column:1/-1}.lesson>span:empty{display:none}.lesson>span:not(.chars):not(.mini){grid-column:1/-1}.act{min-width:0}}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .meter{flex:1;min-width:120px}
.stage{max-width:780px;margin:0 auto}
.arena{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:8px;border-radius:16px;padding:34px 12px 12px;margin:12px 0;overflow:hidden;
background:linear-gradient(transparent 72%,light-dark(#d9e4ee,#1e2a36) 72%),linear-gradient(light-dark(#eef4fa,#17202a),light-dark(#e3edf6,#151d26))}
.fighter{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.fighter .body{width:min(116px,26vw);aspect-ratio:1}
.fighter svg{width:100%;height:100%;overflow:visible}
.tag{font-size:14px;font-weight:500;text-align:center}
.hearts{color:var(--red);font-size:17px;letter-spacing:2px;min-height:22px}.hearts .e{color:var(--line)}
.hhp i{background:var(--ok)!important}
.hp{width:min(140px,30vw);height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.hp i{display:block;height:100%;background:var(--red);transition:width .4s}
.vs{font-size:13px;color:var(--gold);font-weight:900;align-self:center;text-align:center;min-width:3.5em}
.bmsg{position:absolute;left:8px;right:8px;top:8px;text-align:center;font-weight:700;font-size:15px}
.dmg{position:absolute;top:-6px;font-weight:900;font-size:24px;color:var(--red);animation:up .9s forwards;pointer-events:none}
.dmg.heal{color:var(--ok)}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.atkR{animation:atkR .45s}@keyframes atkR{50%{transform:translateX(44px) rotate(8deg)}}
.atkL{animation:atkL .45s}@keyframes atkL{50%{transform:translateX(-44px) rotate(-6deg)}}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ko .body{opacity:.3;filter:grayscale(1);transform:rotate(-10deg) translateY(8px);transition:.6s}
.sil svg{filter:brightness(0);opacity:.16}
.q{font-size:clamp(20px,3vw,26px);line-height:1.6;margin:14px 0}
.q ruby rt,.passage rt{font-size:11px;color:var(--muted);font-family:"Noto Sans SC",sans-serif}
.big{font-size:clamp(44px,8vw,64px);line-height:1}
.blank{display:inline-block;min-width:1.4em;border-bottom:3px solid var(--red);text-align:center;color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.opt{font-size:34px;min-height:84px;border-width:2px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--red)}
.fb{min-height:28px;margin:12px 0;font-weight:500}.fb.ok{color:var(--ok)}.fb.bad{color:var(--red)}
.hintbox{background:var(--partbg);border-radius:10px;padding:8px 12px;margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pad{position:relative;width:min(290px,78vw);aspect-ratio:1;margin:8px auto;border:2px solid var(--red);border-radius:6px;touch-action:none;
background:linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,
linear-gradient(45deg,transparent calc(50% - .5px),var(--grid) 50%,transparent calc(50% + .5px)),linear-gradient(-45deg,transparent calc(50% - .5px),var(--grid) 50%,transparent calc(50% + .5px))}
.pad>svg{position:absolute;inset:0;width:100%;height:100%}
.cue{text-align:center}.cue .py{font-size:26px;color:var(--red);font-weight:500}.cue .ctx{font-size:30px}.cue .en{color:var(--muted)}
.passage{font-size:21px;line-height:2.4;background:var(--soft);border-radius:12px;padding:16px 20px}
.passage p{margin:0 0 4px}
.passage ruby{cursor:pointer;border-radius:4px}.rd:not(.nopy) .passage ruby{margin:0 .14em}
.passage ruby:hover{background:light-dark(#fde6e3,#3a2321)}
.passage .sen.on{background:light-dark(#fff1c9,#3a3018);border-radius:6px}
.passage ruby.sel{background:var(--red);color:#fff}
.passage .en{font-family:"Noto Sans SC",sans-serif;font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 14px}
.rd.nopy rt{display:none}.rd.nopy .passage{line-height:1.9}
.rd.noen .en,.rd.noen .qen{display:none}
.qen{font-size:14px;color:var(--muted)}
.wordcard{position:sticky;bottom:10px;z-index:2;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center;background:var(--bg);border:2px solid var(--cover);border-radius:14px;padding:12px 16px;margin-top:12px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.wordcard .c{font-size:48px;line-height:1;grid-row:span 3}
.wordcard .p{font-size:20px;color:var(--red);font-weight:500}
.rq{border-top:1px solid var(--line);padding:16px 0}
.rq .n{font-weight:700;margin-right:6px}
.rq .opts{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:8px}
.rq label.o{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;cursor:pointer}
.rq label.o small{display:block;color:var(--muted)}
.mark{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.mark.ok{background:var(--okbg)}.mark.part{background:var(--partbg)}.mark.bad{background:var(--badbg)}
.model{color:var(--muted);margin-top:4px}
.sum{text-align:center;padding:12px 0}.sum .stars{font-size:44px}
.revchars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.revchars span{border:2px solid var(--red);border-radius:4px;width:52px;height:52px;display:grid;place-items:center;font-size:30px}
.reward{display:inline-block;background:light-dark(#fff5d6,#33291a);border:1px solid var(--gold);border-radius:12px;padding:8px 14px;margin:4px}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.heroes button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;border-width:2px}
.heroes button svg{width:120px;height:120px;overflow:visible}
.heroes button[aria-pressed=true]{border-color:var(--red)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.dex div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:14px}
.dex svg{width:84px;height:84px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.set label{display:flex;gap:10px;align-items:center;min-height:44px}
.set input{width:20px;height:20px}
.banner{background:var(--badbg);padding:10px 16px;font-size:14px}
.say{min-height:40px;padding:4px 12px;font-size:14px}
.cz{display:inline-block;min-height:34px;min-width:4.5em;padding:0 8px;margin:0 3px;border:0;border-bottom:3px solid var(--red);border-radius:6px 6px 0 0;background:var(--partbg);font-family:"Noto Sans SC",sans-serif;font-size:17px;line-height:1.5;color:var(--ink);vertical-align:baseline;cursor:pointer}
.cz.cur{outline:3px solid var(--cover);outline-offset:1px}.cz.pre{background:light-dark(#e6f0fa,#1b2b3d)}
.cz.ok{background:var(--okbg);border-color:var(--ok)}.cz.bad{background:var(--badbg)}
.clue{background:light-dark(#fff1a8,#4a3f10);box-shadow:0 0 0 2px light-dark(#f2d24b,#8a741c);border-radius:3px}
.who{color:var(--cover);font-family:"Noto Sans SC",sans-serif;font-weight:700}
.passage .dl{margin:0 0 2px}
.pspanel{position:sticky;bottom:8px;z-index:3;background:var(--bg);border:2px solid var(--cover);border-radius:14px;padding:12px 14px;margin-top:14px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.psopts{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin-top:10px}
.pso{font-size:19px;min-height:52px;text-align:left;border-width:2px}.pso small{display:block;font-size:13px;color:var(--muted)}
.pso.sel{border-color:var(--cover);background:var(--soft)}.pso.ok{background:var(--okbg);border-color:var(--ok)}.pso.bad{background:var(--badbg);border-color:var(--red)}
.psx{border-top:1px solid var(--line);padding:10px 0}
.daily{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;border-left:6px solid var(--red)}
.storycard{border-left-color:var(--gold)}
.big-play{font-size:18px;min-height:52px;padding:8px 22px}
.passage .dl.on{background:light-dark(#fff1c9,#3a3018);border-radius:6px}
.storywrap{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:24px;align-items:start;margin-top:10px}
@media(max-width:860px){.storywrap{grid-template-columns:minmax(0,1fr)}}
.smap{width:100%;height:auto;display:block}
.snode.open{cursor:pointer}.snode.open:hover circle,.snode:focus-visible circle{stroke:var(--red);stroke-width:6}
.snode{outline:none}
.slist{display:grid;gap:6px}.slist button{text-align:left;min-height:40px;padding:6px 12px}
.scenebox{border-radius:16px;overflow:hidden;border:1px solid var(--line)}.scene{display:block;width:100%;height:auto}
@media(max-width:700px){.pspanel{position:static;box-shadow:none}}
.tier{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
.tier .rec{font-size:13px;background:var(--red);color:#fff;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.why{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px}.why .wen{color:var(--muted);font-size:14px;margin-top:4px}
.fcard{display:block;perspective:1000px;width:min(320px,84vw);aspect-ratio:3/4;margin:16px auto 10px;padding:0;border:0;background:none;min-height:0}
.fcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fcard.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--red);border-radius:18px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.face.back{transform:rotateY(180deg)}
.fbig{font-size:clamp(110px,30vw,150px);line-height:1;width:1.25em;height:1.25em;display:grid;place-items:center;border:1px dashed var(--grid);background:linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat}
.ftag{font-size:13px;border-radius:999px;padding:3px 10px;background:var(--red);color:#fff}.ftag.soft{background:var(--soft);color:var(--muted)}
.fpy{font-size:30px;color:var(--red);font-weight:500}.fword{font-size:26px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9;width:min(92vw,460px);background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{display:block;margin-top:8px;background:var(--bg);color:var(--ink);border:0;min-height:40px}
.topic{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.ans{min-height:64px;border-bottom:3px solid var(--red);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;margin:10px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chipw{font-size:22px;padding:6px 14px;border-width:2px;border-radius:10px}
.chipw:disabled{opacity:.25}
.fixs{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.fc{font-size:30px;min-height:56px;min-width:46px;padding:2px 6px;border-color:transparent;background:transparent}
.fc:hover:not(:disabled){background:var(--soft)}.fc.ok{background:var(--okbg);border-color:var(--ok)}.fc.bad{background:var(--badbg);border-color:var(--red)}
.gopt{font-size:24px;min-height:64px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px clamp(16px,6vw,56px);max-width:560px;margin-top:10px}
.mcol{display:grid;gap:10px;align-content:start}
.mw{font-size:22px;min-height:54px;border-width:2px;border-radius:12px}
.mw:disabled{opacity:1;cursor:default}
.mw.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--soft)}
.mw.c0{border-color:#3b82c4;background:light-dark(#e6f0fa,#1b2b3d)}.mw.c1{border-color:#c8821a;background:light-dark(#fcf0dc,#3a2c16)}
.mw.c2{border-color:#7a5cc4;background:light-dark(#efe9fa,#2a2340)}.mw.c3{border-color:#2b8a7a;background:light-dark(#e2f4f0,#16302b)}
.mw.c4{border-color:#b84a8a;background:light-dark(#fae6f1,#3a1c2d)}
.mw.ok{outline:3px solid var(--ok);outline-offset:1px}.mw.bad{outline:3px dashed var(--red);outline-offset:1px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="cover band">
  <div class="wrap">
    <h1 id="brandHome" style="cursor:pointer" title="回到首页">EZ华文 · 小学华文复习<small id="hello">小一至小六 · 认读、写字、阅读</small></h1>
    <div class="chips">
      <button class="chip" id="chipHome">首页</button>
      <button class="chip" id="chipHero">我的英雄</button>
      <button class="chip" id="chipReview">复习本 0</button>
      <button class="chip" id="chipProg">我的进度</button>
    </div>
  </div>
</header>
<div id="warn"></div>
<main class="band"><div class="wrap" id="app"></div></main>

<script>window.EZ={levels:{},dict:{},ctx:{}}</script>

<script>
{
/* ================= data ================= */
const LEVELS=[['1A','一上'],['1B','一下'],['2A','二上'],['2B','二下'],['3A','三上'],['3B','三下'],['4A','四上'],['4B','四下'],['5A','五上'],['5B','五下'],['6A','六上'],['6B','六下']].map(([id,name],k)=>({id,name,k}));
const CONTENT=EZ.levels;
const DICT={};for(const [c,v] of Object.entries(EZ.dict))DICT[c]={py:v[0],en:v[1]};
for(const C of Object.values(CONTENT)){C.fill=C.fill.map(([l,q,a,o,en])=>({l,q,a,o:[...o],en}))}
const MON_NAMES=['糊涂虫','乱笔怪','忘字妖','墨点精','歪歪兽','偷字鼠','瞌睡怪','倒写怪','迷路妖','吵闹精','马虎龟','多笔怪','少笔妖','拖拉熊','粗心猴','漏字鸟','发呆蛙','涂改怪','打嗝兽','喷墨鱼','黏黏怪','咕噜怪','啰嗦妖','捣蛋鬼','迷糊猫','翻页虫','乱叫鸡','慢吞吞','跳格怪','反字精'];
const BOSS_NAMES=['大雾王','乌云王','迷宫王','黑墨王','狂风王','冰冻王','打雷王','沙尘王','暗影王','石头王','火焰王','海浪王'];
const HEROES={mo:{name:'墨墨',desc:'一滴会写字的墨水'},zhi:{name:'纸纸',desc:'用作业纸折成的纸鹤'},shi:{name:'狮狮',desc:'爱打鼓的小醒狮'}};
const GEAR=[['brush','神笔',6,'攻击 +4'],['shield','砚台盾',15,'多一条命'],['gold','金墨',30,'答对 2 题就连击'],['cape','飞天披风',50,'每场挡住一次攻击']];
const BADGES=[['first','第一颗星'],['streak3','连续学习三天'],['lv1A','一上完成'],['clear','清空复习本'],['boss','打败第一个大王'],['daily7','每日一练七天'],['story','完成冒险故事']];

/* ================= state ================= */
const KEY='ez-cl-v1';let canStore=true;
const blank=()=>({v:1,name:'',stars:{},best:{},review:{},streak:{last:'',n:0},badges:[],log:[],hadReview:0,hero:{type:'',xp:0,won:[],up:{atk:0,hp:0,life:0}},story:{read:[],quiz:[],seen:0},set:{py:true,en:false,battle:true}});
let S;
try{const o=JSON.parse(localStorage.getItem(KEY))||{};S={...blank(),...o};S.hero={...blank().hero,...(o.hero||{})};S.hero.up={atk:0,hp:0,life:0,...((o.hero||{}).up||{})};S.story={read:[],quiz:[],seen:0,...(o.story||{})};S.set={...blank().set,...(o.set||{})}}catch(e){canStore=false;S=blank()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canStore=false;showWarn()}};
const showWarn=()=>{document.getElementById('warn').innerHTML=canStore?'':'<div class="banner">这个浏览器不能自动保存进度。做完练习后，请到“我的进度”复制进度码。</div>'};
showWarn();

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>new Date().toLocaleDateString('en-CA');
const yesterday=()=>new Date(Date.now()-864e5).toLocaleDateString('en-CA');
const starsOf=p=>p>=.9?3:p>=.7?2:p>=.5?1:0;
const starHtml=n=>`<span class="stars" aria-label="${n} 颗星">${'★'.repeat(n)}<span class="e">${'★'.repeat(3-n)}</span></span>`;
const isHan=c=>/[一-鿿]/.test(c);
const lvName=id=>{const L=LEVELS.find(l=>l.id===id);return L?L.name:''};
const lvIdx=id=>{const L=LEVELS.find(l=>l.id===id);return L?L.k:0};
const py=c=>(DICT[c]||{}).py||'';
const en=c=>(DICT[c]||{}).en||'';
const tone=p=>/[āēīōūǖ]/.test(p)?1:/[áéíóúǘ]/.test(p)?2:/[ǎěǐǒǔǚ]/.test(p)?3:/[àèìòùǜ]/.test(p)?4:0;
function rubyLine(s){const cs=[...s];return cs.map((c,i)=>{if(!isHan(c))return c==='＿'?'<span class="blank">　</span>':esc(c);let p=py(c);const nx=cs[i+1];
  if(c==='一'&&nx&&isHan(nx))p=tone(py(nx))===4?'yí':'yì';if(c==='不'&&nx&&tone(py(nx))===4)p='bú';return p?`<ruby>${c}<rt>${p}</rt></ruby>`:c}).join('')}
const canSpeak='speechSynthesis' in window;
let voices=[];const loadV=()=>{try{voices=speechSynthesis.getVoices()||[]}catch(e){}};
if(canSpeak){loadV();try{speechSynthesis.addEventListener('voiceschanged',loadV)}catch(e){}}
function pickVoice(){const z=voices.filter(v=>/^zh/i.test(v.lang)&&!/HK|yue|TW/i.test(v.lang));return z.find(v=>/zh[-_]CN/i.test(v.lang))||z[0]||null}
let heard=false,tipShown=false;
function soundTip(force){if(!force&&(heard||tipShown))return;tipShown=true;document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');
  d.innerHTML=(canSpeak?'':'这个浏览器不能朗读。请用 Safari 或 Chrome 打开这个网站（不要在 WhatsApp、Telegram 等应用里直接打开）。<br>')+'听不到声音吗？<br>iPhone / iPad：把侧边的静音开关拨回响铃，再调高音量。<br>如果还是没有声音，请到“设置 › 辅助功能 › 朗读内容 › 声音”下载“中文（中国大陆）”的声音。<button type="button">知道了</button>';
  d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),15000)}
function say(t){if(!canSpeak){soundTip(true);return}try{loadV();
  const go=()=>{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';const v=pickVoice();if(v)u.voice=v;u.rate=.8;u.onstart=()=>{heard=true};u.onerror=()=>soundTip();speechSynthesis.speak(u);setTimeout(()=>{if(!heard)soundTip()},2500)};
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,150)}else go();
  if(speechSynthesis.paused)speechSynthesis.resume()}catch(e){soundTip()}}
const sayBtn=(t,l='听一听')=>`<button class="say" type="button" data-say="${esc(t)}">${l}</button>`;
app.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say)});
function bump(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

/* ================= pictures (original characters) ================= */
function heroSVG(type,gear){
  const g=gear||[];let s='<svg viewBox="0 0 120 120" aria-hidden="true">';
  if(g.includes('gold'))s+='<circle cx="60" cy="66" r="56" fill="#f6d36b" opacity=".35"/>';
  if(g.includes('cape'))s+='<path d="M30 66Q60 40 90 66L104 116H16Z" fill="#b8322b"/>';
  if(type==='zhi'){
    s+='<path d="M20 70L2 46L36 60Z" fill="#fff" stroke="#c9c2b0" stroke-width="2"/><path d="M100 70L118 46L84 60Z" fill="#fff" stroke="#c9c2b0" stroke-width="2"/>'
    +'<path d="M60 20L100 70L60 110L20 70Z" fill="#f7f4ec" stroke="#c9c2b0" stroke-width="2"/><path d="M60 20V110M20 70H100" stroke="#e2dccb" stroke-width="2"/>'
    +'<path d="M60 20L72 4L64 26Z" fill="#cf3e35"/><circle cx="50" cy="62" r="5" fill="#222"/><circle cx="70" cy="62" r="5" fill="#222"/><circle cx="51.5" cy="60.5" r="1.6" fill="#fff"/><circle cx="71.5" cy="60.5" r="1.6" fill="#fff"/>'
    +'<circle cx="42" cy="76" r="4" fill="#f29b95"/><circle cx="78" cy="76" r="4" fill="#f29b95"/><path d="M54 78q6 6 12 0" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
  }else if(type==='shi'){
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2;s+=`<circle cx="${(60+Math.cos(a)*38).toFixed(1)}" cy="${(68+Math.sin(a)*38).toFixed(1)}" r="14" fill="#e0702c"/>`}
    s+='<circle cx="60" cy="68" r="36" fill="#f6c64a"/><path d="M38 52q8-8 16 0M66 52q8-8 16 0" stroke="#7a3b12" stroke-width="5" fill="none" stroke-linecap="round"/>'
    +'<circle cx="47" cy="64" r="8" fill="#fff"/><circle cx="73" cy="64" r="8" fill="#fff"/><circle cx="48" cy="65" r="4" fill="#222"/><circle cx="74" cy="65" r="4" fill="#222"/>'
    +'<ellipse cx="60" cy="78" rx="8" ry="6" fill="#cf3e35"/><path d="M48 90q12 10 24 0" stroke="#7a3b12" stroke-width="3" fill="#fff"/><circle cx="60" cy="38" r="5" fill="#cf3e35"/>';
  }else{
    s+='<path d="M60 8C60 8 99 56 99 78A39 39 0 0 1 21 78C21 56 60 8 60 8Z" fill="#2b3f66"/><ellipse cx="44" cy="58" rx="7" ry="12" fill="#fff" opacity=".22"/>'
    +'<circle cx="48" cy="78" r="9" fill="#fff"/><circle cx="72" cy="78" r="9" fill="#fff"/><circle cx="50" cy="80" r="4.5" fill="#111"/><circle cx="74" cy="80" r="4.5" fill="#111"/>'
    +'<circle cx="39" cy="93" r="4" fill="#f08a8a" opacity=".85"/><circle cx="81" cy="93" r="4" fill="#f08a8a" opacity=".85"/><path d="M54 95q6 6 12 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>';
  }
  if(g.includes('brush'))s+='<line x1="96" y1="100" x2="116" y2="58" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/><path d="M96 100l-7 13 11-6z" fill="#111"/>';
  if(g.includes('shield'))s+='<circle cx="14" cy="94" r="14" fill="#5b4535" stroke="#d9b45a" stroke-width="3"/><text x="14" y="99" text-anchor="middle" font-size="13" fill="#f3e3b5" font-family="serif">砚</text>';
  return s+'</svg>';
}
function monsterSVG(seed,hue,boss){
  let x=seed*9301+49297;const r=()=>(x=(x*9301+49297)%233280)/233280;
  const body=`hsl(${hue} 52% 52%)`,dark=`hsl(${hue} 50% 32%)`,belly=`hsl(${hue} 60% 76%)`;
  const shape=seed%3;let s='<svg viewBox="0 0 120 120" aria-hidden="true">';
  if(r()>.35)s+=`<path d="M36 34L26 8L50 28ZM84 34L94 8L70 28Z" fill="${dark}"/>`;
  s+=`<ellipse cx="18" cy="74" rx="9" ry="14" fill="${dark}"/><ellipse cx="102" cy="74" rx="9" ry="14" fill="${dark}"/>`;
  s+=shape===0?`<path d="M20 92C12 52 34 22 60 22S108 52 100 92C96 110 24 110 20 92Z" fill="${body}"/>`
    :shape===1?`<path d="M60 16C78 16 82 40 92 60C106 88 92 110 60 110S14 88 28 60C38 40 42 16 60 16Z" fill="${body}"/>`
    :`<rect x="18" y="26" width="84" height="82" rx="28" fill="${body}"/>`;
  s+=`<ellipse cx="60" cy="88" rx="26" ry="15" fill="${belly}"/>`;
  const ne=1+Math.floor(r()*3);const E=ne===1?[[60,56,13]]:ne===2?[[46,56,10],[74,56,10]]:[[40,58,8],[60,46,8],[80,58,8]];
  E.forEach(([cx,cy,rr])=>{s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="#fff"/><circle cx="${cx+rr*.25}" cy="${cy+rr*.15}" r="${rr*.48}" fill="#1b1b1b"/>`});
  s+=`<path d="M44 76Q60 88 76 76Z" fill="${dark}"/><path d="M50 78l3 5 3-4M64 78l3 4 3-5" fill="#fff"/>`;
  if(boss)s+='<path d="M38 26l6-18 9 12 7-16 7 16 9-12 6 18z" fill="#e9b949" stroke="#a57712" stroke-width="2"/>';
  return s+'</svg>';
}
const monFor=(lv,i)=>({name:MON_NAMES[(lvIdx(lv)*7+i)%MON_NAMES.length],svg:monsterSVG(i+1+lvIdx(lv)*11,(lvIdx(lv)*36+i*29)%360,false)});
const gramMon=lv=>({name:['语法怪','病句妖','乱序兽','标点精'][lvIdx(lv)%4],svg:monsterSVG(80+lvIdx(lv)*5,(lvIdx(lv)*36+120)%360,false)});
const collMon=lv=>({name:['搭配怪','配对妖','错配兽','连线精'][lvIdx(lv)%4],svg:monsterSVG(140+lvIdx(lv)*3,(lvIdx(lv)*36+60)%360,false)});
const bossFor=(lv,i)=>({name:BOSS_NAMES[(lvIdx(lv)*2+i)%BOSS_NAMES.length],svg:monsterSVG(i+5+lvIdx(lv)*7,(lvIdx(lv)*36+200+i*40)%360,true)});

/* ================= hero stats ================= */
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
const gearOwned=()=>GEAR.filter(g=>totalStars()>=g[2]).map(g=>g[0]);
const xpFor=n=>40*n*(n-1);
const heroLv=()=>{let n=1;while(xpFor(n+1)<=S.hero.xp)n++;return n};
const UPG=[['atk','攻击','每次答对，打怪物更痛',3,10],['hp','体力','每条命能挨更多下攻击',10,10],['life','生命','多一条命，更不容易累倒',1,3]];
const upSpent=()=>S.hero.up.atk+S.hero.up.hp+S.hero.up.life;
const upPoints=()=>Math.max(0,heroLv()-1-upSpent());
const heroAtk=()=>10+3*S.hero.up.atk+(gearOwned().includes('brush')?4:0);
const heroHP=()=>20+10*S.hero.up.hp;
const heroHearts=()=>2+S.hero.up.life+(gearOwned().includes('shield')?1:0);
const comboAt=()=>gearOwned().includes('gold')?2:3;

/* ================= progress ================= */
function actList(lv){const C=CONTENT[lv],a=[];C.lessons.forEach((l,i)=>{a.push({id:`${lv}|${i}|r`,kind:'r',lv,i,label:`${l.n} · 认读`});a.push({id:`${lv}|${i}|w`,kind:'w',lv,i,label:`${l.n} · 写字`})});if(C.grammar&&C.grammar.length)a.push({id:`${lv}|g`,kind:'g',lv,i:0,label:'语文应用'});if(C.colloc&&C.colloc.length)a.push({id:`${lv}|c`,kind:'c',lv,i:0,label:'词语搭配'});C.passages.forEach((p,i)=>a.push({id:`${lv}|p${i}`,kind:'p',lv,i,label:`阅读：${p.title}`}));return a}
function levelPct(lv){if(!CONTENT[lv])return 0;const a=actList(lv);return a.reduce((s,x)=>s+(S.stars[x.id]||0),0)/(a.length*3)}
const PS=(window.EZ&&EZ.psle)?EZ.psle.tiers:[];
const psAll=()=>{const a=[];PS.forEach((T,ti)=>T.sets.forEach(s=>a.push({id:'PS|'+s.id,T,ti,s})));return a};
const psMon=sid=>{const a=psAll();const k=a.findIndex(x=>x.s.id===sid);const x=a[k];return {name:({cloze:'填空',dialog:'对话',listen:'听力'})[x.s.type]+['小王','大王','魔王'][x.ti],svg:monsterSVG(200+k*7,(k*47+20)%360,true)}};
function skillStats(){const r={r:[0,0,0],w:[0,0,0],p:[0,0,0],g:[0,0,0]};for(const lv in CONTENT)for(const x of actList(lv)){const t=r[x.kind==='c'?'g':x.kind];t[1]++;if(x.id in S.best){t[0]+=S.best[x.id];t[2]++}}r.e=[0,0,0];for(const x of psAll()){r.e[1]++;if(x.id in S.best){r.e[0]+=S.best[x.id];r.e[2]++}}return r}
let newBadge=null;
function record(id,pct){
  S.best[id]=Math.max(S.best[id]||0,pct);
  S.stars[id]=Math.max(S.stars[id]||0,starsOf(pct));
  S.log.push({d:today(),a:id,s:Math.round(pct*100)});if(S.log.length>300)S.log=S.log.slice(-300);
  const t=today();if(S.streak.last!==t){S.streak.n=S.streak.last===yesterday()?S.streak.n+1:1;S.streak.last=t}
  checkBadges();save();chips();
}
function checkBadges(){
  const add=k=>{if(!S.badges.includes(k)){S.badges.push(k);newBadge=k}};
  if(Object.values(S.stars).some(n=>n>0))add('first');
  if(S.streak.n>=3)add('streak3');
  for(const lv in CONTENT)if(actList(lv).every(x=>(S.stars[x.id]||0)>=1))add('lv'+lv);
  if(S.hero.won.some(w=>w.includes('|p')))add('boss');
  if(typeof dailyStreak==='function'&&dailyStreak()>=7)add('daily7');
  if(EZ.story&&S.story&&S.story.read.length>=EZ.story.length)add('story');
  const n=Object.keys(S.review).length;S.hadReview=Math.max(S.hadReview,n);
  if(n===0&&S.hadReview>=3)add('clear');
}
function missed(c,lv,k){const o=S.review[c];S.review[c]={lv,k:o&&o.k==='w'?'w':k,n:0}}
function hit(c){const r=S.review[c];if(r){r.n++;if(r.n>=2)delete S.review[c]}}
function chips(){
  $('#chipReview').textContent=`复习本 ${Object.keys(S.review).length}`;
  $('#chipHero').textContent=S.hero.type?`${HEROES[S.hero.type].name} Lv${heroLv()}${upPoints()?' · 可升级':''}`:'我的英雄';
  const st=S.streak.last===today()||S.streak.last===yesterday()?S.streak.n:0;
  $('#hello').textContent=(S.name?`${S.name}，欢迎回来`:'小一至小六')+(st?` · 连续学习 ${st} 天`:' · 认读、写字、阅读');
}
$('#chipHome').onclick=()=>go('home');$('#chipProg').onclick=()=>go('progress');
$('#chipReview').onclick=()=>startReview();$('#chipHero').onclick=()=>go('hero');

/* ================= recommendation ================= */
function nextStep(){
  const rv=Object.keys(S.review).length;
  if(rv>=6)return{t:`复习本里有 ${rv} 个字`,d:'先把不熟的字练熟，再往前走。',btn:'开始复习',go:startReview};
  const last=[...S.log].reverse().find(l=>l.a&&l.a.includes('|')&&LEVELS.some(L=>L.id===l.a.split('|')[0]));const start=last?lvIdx(last.a.split('|')[0]):0;
  for(const L of LEVELS.slice(start)){if(!CONTENT[L.id])continue;
    for(const x of actList(L.id)){const s=S.stars[x.id];if((s||0)<2)return{lv:L.id,t:`${L.name} · ${x.label}`,d:s===undefined?(x.kind==='p'?`大王“${bossFor(x.lv,x.i).name}”在等你。`:x.kind==='g'?`“${gramMon(x.lv).name}”在语文应用里等你。`:x.kind==='c'?`“${collMon(x.lv).name}”在词语搭配里等你。`:`怪物“${monFor(x.lv,x.i).name}”在这一课。`):`上次 ${s} 颗星，再做一次争取两颗星以上。`,btn:'出发',go:()=>startAct(x)}}}
  if(rv)return{t:`复习本里有 ${rv} 个字`,d:'把剩下的字复习完吧。',btn:'开始复习',go:startReview};
  return{t:'已开放的级别都拿到两颗星以上',d:'下一级制作中。你可以回去争取三颗星。',btn:null};
}

/* ================= views ================= */
let writer=null;
function stopWriter(){if(writer){try{writer.cancelQuiz()}catch(e){}writer=null}}
function go(v){stopWriter();try{speechSynthesis.cancel()}catch(e){}if(location.hash==='#'+v)render();else location.hash=v}
window.addEventListener('hashchange',()=>{stopWriter();try{speechSynthesis.cancel()}catch(e){}render()});
let backTo='home';
function render(){
  try{route()}catch(err){console.error(err);
    app.innerHTML=`<div class="card"><h2>这一页打不开</h2><p class="muted">请按“回到首页”。如果还是这样，请告诉老师：<br><small>${esc(String(err&&err.message||err))}</small></p><button class="pri" id="errHome">回到首页</button></div>`;
    $('#errHome').onclick=()=>{history.replaceState(null,'','#home');try{viewHome()}catch(e){location.reload()}}}
}
function route(){
  window.scrollTo(0,0);
  const h=location.hash.slice(1)||'home';
  if(h==='play'){history.replaceState(null,'','#'+backTo);return route()}
  if(!S.name||!S.hero.type)return viewStart();
  if(h==='progress')return viewProgress();
  if(h==='hero')return viewHero();
  if(h==='psle')return viewPSLE();
  if(h==='story'&&EZ.story)return viewStory();
  if(h.startsWith('chapter-')&&EZ.story){const k=+h.slice(8)-1;if(EZ.story[k]&&totalStars()>=EZ.story[k].need)return viewChapter(k,true);history.replaceState(null,'','#story');return viewStory()}
  if(h.startsWith('level-')){const id=h.slice(6).toUpperCase();if(CONTENT[id])return viewLevel(id)}
  viewHome();

  if(prev)prev.val.forEach((v,n)=>{if(v===1){st.done[n]=true;st.val[n]=1;st.pick[n]=opts[n].findIndex(x=>x.ok)}});
  if(prev)st.cur=st.done.findIndex(d=>!d);

  const sayText=t=>fillTxt(t).replace(/^[^：]{1,6}：/,'');
  function clueSet(){const out=new Set();if(st.clue<0)return out;const c=set.blanks[st.clue].clue;const idx=[];let flat='';
    [...set.text].forEach((ch,i)=>{if(ch!=='|'&&ch!=='\n'){idx.push(i);flat+=ch}});const p=flat.indexOf(c);if(p>=0)for(let j=0;j<c.length;j++)out.add(idx[p+j]);return out}
  function passage(){
    const cl=clueSet();let k=0,si=0,html='';const chars=[...set.text];let i=0;
    const lines=[];let line=[];
    // tokenise into lines of tokens

      if(ch==='\n'){lines.push(line);line=[];i++;continue}
      if(ch==='【'){const n=+chars[i+1];line.push({b:n-1});i+=3;continue}
      line.push({c:ch,i});i++}
    lines.push(line);

const lastLevel=()=>{const l=[...S.log].reverse().find(x=>/^\d[AB]\|/.test(x.a));return l?l.a.split('|')[0]:'1A'};
const dailyStreak=()=>{let n=0;const d=new Date();if(!(('DAY|'+today()) in S.best))d.setDate(d.getDate()-1);for(;;){const k='DAY|'+d.toLocaleDateString('en-CA');if(k in S.best){n++;d.setDate(d.getDate()-1)}else break}return n};
function dailyItems(){
  const lv=lastLevel(),k=lvIdx(lv),C=CONTENT[lv],items=[];
  const rv=shuffle(Object.entries(S.review));let w=0;
  rv.slice(0,3).forEach(([c,r])=>{if(r.k==='w'&&w<1&&CONTENT[r.lv]){w++;items.push({type:'write',lv:r.lv,ch:c})}else if(CONTENT[r.lv])items.push(pyItem(r.lv,c,''))});
  shuffle(C.fill).slice(0,2).forEach(f=>items.push({type:'fill',lv,ch:f.a,q:f.q,en:f.en,opts:shuffle(f.o)}));
  if(k>0){const P=CONTENT[LEVELS[k-1].id];const L=P.lessons[Math.random()*P.lessons.length|0];items.push(pyItem(LEVELS[k-1].id,[...L.read][Math.random()*L.read.length|0],L.read))}
  const near=key=>{for(let j=k;j>=0;j--){const X=CONTENT[LEVELS[j].id];if(X[key]&&X[key].length)return X[key]}return null};
  const G=near('grammar');if(G){const g=G[Math.random()*G.length|0];items.push(gItem(g))}
  const Co=near('colloc');if(Co){const c=Co[Math.random()*Co.length|0];items.push(gItem({...c,topic:'词语搭配'}))}
  let guard=0;while(items.length<8&&guard++<20){const L=C.lessons[Math.random()*C.lessons.length|0];const ch=[...L.read][Math.random()*L.read.length|0];if(!items.some(x=>x.ch===ch))items.push(pyItem(lv,ch,L.read))}
  return shuffle(items).slice(0,8);
}
function gItem(g){let parts=null;if(g.t==='order'){parts=shuffle(g.parts);let n=0;while(parts.join('')===g.parts.join('')&&n++<20)parts=shuffle(g.parts)}return {type:'g',g,opts:g.t==='pick'?shuffle(g.o):null,parts,R:g.t==='match'?shuffle(g.R):null}}
function refreshItem(it){if(it.type==='py')return pyItem(it.lv,it.ch,'');if(it.type==='fill')return {...it,opts:shuffle(it.opts)};if(it.type==='g')return gItem(it.g);return {...it}}
function startDaily(){stopWriter();run({title:'每日一练',items:dailyItems(),id:'DAY|'+today(),back:'home',mon:{name:'每日怪',svg:monsterSVG(77,(new Date().getDate()*23)%360,false)},monId:null,again:startDaily})}

  if(!canSpeak){soundTip(true);return false}
  const start=()=>{loadV();const v=pickVoice();const who=[...new Set(lines.map(l=>l[0]))];
    lines.forEach((l,i)=>{const u=new SpeechSynthesisUtterance(l[1]);u.lang='zh-CN';if(v)u.voice=v;u.rate=rate;
      const wi=who.indexOf(l[0]);u.pitch=who.length===1?1:(wi%2?0.8:1.25);
      u.onstart=()=>{heard=true;playing=true;onLine(i)};if(i===lines.length-1)u.onend=()=>{playing=false;onEnd()};u.onerror=()=>{playing=false;onEnd()};speechSynthesis.speak(u)});
    setTimeout(()=>{if(!heard)soundTip()},2500)};
  try{if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(start,150)}else start()}catch(e){soundTip(true);return false}

}

function sceneSVG(kind,hue){

  let s=`<svg viewBox="0 0 600 220" class="scene" aria-hidden="true"><defs><linearGradient id="sk${kind}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${night?`hsl(${hue} 45% 18%)`:`hsl(${hue} 70% 86%)`}"/><stop offset="1" stop-color="${night?`hsl(${hue} 40% 32%)`:`hsl(${hue} 60% 95%)`}"/></linearGradient></defs><rect width="600" height="220" fill="url(#sk${kind})"/>`;
  if(night)for(let i=0;i<40;i++)s+=`<circle cx="${(i*137)%600}" cy="${(i*53)%120+5}" r="${i%5?1.2:2.2}" fill="#fff" opacity=".8"/>`;else s+='<circle cx="520" cy="50" r="26" fill="#ffd86b"/>';
  const ground=`hsl(${hue} 35% ${night?28:55}%)`;
  if(kind!=='sea'&&kind!=='island')s+=`<path d="M0 170Q150 140 300 165T600 158V220H0Z" fill="${ground}"/>`;
  if(kind==='village')[110,240,370].forEach((x,i)=>{s+=`<rect x="${x}" y="${120+i*4}" width="80" height="55" fill="hsl(${hue+i*30} 50% 70%)"/><path d="M${x-8} ${122+i*4}L${x+40} ${88+i*4}L${x+88} ${122+i*4}Z" fill="hsl(${hue} 55% 40%)"/><rect x="${x+30}" y="${145+i*4}" width="20" height="30" fill="hsl(${hue} 40% 35%)"/>`});
  if(kind==='forest')for(let i=0;i<9;i++){const x=40+i*65,h=60+(i%3)*20;s+=`<rect x="${x-5}" y="${165-12}" width="10" height="16" fill="#7a5230"/><path d="M${x-28} 155L${x} ${155-h}L${x+28} 155Z" fill="hsl(${110+i*6} 45% ${30+(i%2)*8}%)"/>`}
  if(kind==='river'){s+='<path d="M0 185Q150 165 300 185T600 180V205Q450 190 300 205T0 205Z" fill="#5aa7d8"/><path d="M220 186Q300 130 380 186" stroke="#8a5a2b" stroke-width="10" fill="none"/>'}
  if(kind==='city'||kind==='gate'){s+=`<rect x="60" y="100" width="480" height="70" fill="hsl(${hue} 25% 62%)"/>`;for(let x=60;x<540;x+=40)s+=`<rect x="${x}" y="88" width="24" height="14" fill="hsl(${hue} 25% 62%)"/>`;s+=`<path d="M255 170V125A45 45 0 0 1 345 125V170Z" fill="hsl(${hue} 40% 25%)"/><rect x="40" y="60" width="50" height="110" fill="hsl(${hue} 30% 52%)"/><rect x="510" y="60" width="50" height="110" fill="hsl(${hue} 30% 52%)"/>`;if(kind==='gate')s+='<path d="M65 60V20L95 30L65 40" fill="#cf3e35"/><path d="M535 60V20L565 30L535 40" fill="#cf3e35"/>'}
  if(kind==='mountain')s+=`<path d="M40 175L190 40L340 175Z" fill="hsl(${hue} 20% 50%)"/><path d="M150 76L190 40L230 76L210 70L190 80L170 70Z" fill="#fff"/><path d="M260 175L410 70L560 175Z" fill="hsl(${hue} 20% 42%)"/><path d="M380 92L410 70L440 92L425 88L410 96L395 88Z" fill="#fff"/>`;
  if(kind==='camp')s+='<path d="M90 172L170 90L250 172Z" fill="#c8823a"/><path d="M160 172L170 120L180 172Z" fill="#5a3a1a"/><path d="M360 172L430 105L500 172Z" fill="#8a5bb0"/><path d="M290 172L300 140L310 172Z" fill="#ff9d2e"/><path d="M296 172L300 152L304 172Z" fill="#ffe066"/>';
  if(kind==='sea'||kind==='island'){s+='<rect y="150" width="600" height="70" fill="#3f8fc8"/><path d="M0 155Q30 148 60 155T120 155T180 155T240 155T300 155T360 155T420 155T480 155T540 155T600 155" stroke="#bfe3ff" stroke-width="3" fill="none"/>';
    if(kind==='sea')s+='<path d="M220 150H360L340 172H240Z" fill="#8a5a2b"/><path d="M290 150V80L340 140Z" fill="#fff"/><rect x="480" y="70" width="18" height="80" fill="#fff" opacity=".6"/>';
    else s+='<ellipse cx="300" cy="158" rx="160" ry="22" fill="#e2c27a"/><rect x="380" y="70" width="26" height="85" fill="#fff"/><rect x="380" y="90" width="26" height="12" fill="#cf3e35"/><path d="M374 70H412L393 50Z" fill="#cf3e35"/><circle cx="393" cy="62" r="5" fill="#ffd86b"/>'}
  if(kind==='storm'){s+='<ellipse cx="180" cy="50" rx="110" ry="34" fill="#4a4f63"/><ellipse cx="400" cy="45" rx="130" ry="38" fill="#3a3f52"/><path d="M300 70L280 115H300L285 155" stroke="#ffe066" stroke-width="5" fill="none"/>';for(let i=0;i<22;i++)s+=`<line x1="${30+i*27}" y1="${85+(i%3)*10}" x2="${20+i*27}" y2="${110+(i%3)*10}" stroke="#9fc3e6" stroke-width="2"/>`}
  if(kind==='cave')s+=`<path d="M60 175Q90 40 300 40T540 175Z" fill="hsl(${hue} 15% 30%)"/><path d="M200 175Q220 90 300 90T400 175Z" fill="hsl(${hue} 20% 14%)"/><rect x="255" y="140" width="90" height="35" rx="4" fill="#b7861b"/><path d="M255 140Q300 115 345 140Z" fill="#e9b949"/>`;
  if(kind==='stars')s+='<path d="M300 70C270 40 220 60 240 100C255 130 300 150 300 150C300 150 345 130 360 100C380 60 330 40 300 70Z" fill="#ef6a5f"/>';
  if(S.hero.type)s+=heroSVG(S.hero.type,gearOwned()).replace('<svg ',`<svg x="24" y="${kind==='sea'||kind==='island'?92:96}" width="96" height="96" `);
  return s+'</svg>';
}
function viewStory(){
  const ST=EZ.story,ts=totalStars(),un=storyUnlocked();
  if(un>(S.story.seen||0)){S.story.seen=un;save()}

  let svg=`<svg viewBox="0 0 600 1000" class="smap" role="img" aria-label="冒险地图"><rect width="600" height="1000" rx="24" style="fill:light-dark(#f6efe0,#1f1c17)"/>`;
  [[0,260,200],[260,500,120],[500,760,30],[760,1000,280]].forEach(([a,b,h])=>svg+=`<rect y="${a}" width="600" height="${b-a}" fill="hsl(${h} 45% 60%)" opacity=".13"/>`);
  svg+=`<polyline points="${NODES.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:light-dark(#c9b48a,#6b5c40)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${NODES.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:light-dark(#fff,#2b261f)" stroke-width="3" stroke-dasharray="10 12"/>`;
  ST.forEach((c,k)=>{const [x,y]=NODES[k];const open=ts>=c.need,read=S.story.read.includes(k);
    svg+=`<g class="snode ${open?'open':''}" data-story="${k}" tabindex="${open?0:-1}" role="button" aria-label="第${k+1}章 ${c.t}${open?'':'，需要'+c.need+'颗星'}">
     <circle cx="${x}" cy="${y}" r="36" fill="${!open?'light-dark(#cfcfcf,#444)':read?'light-dark(#2b7a4b,#3f9a66)':'#e9b949'}" stroke="#fff" stroke-width="4"/>
     <text x="${x}" y="${y+9}" text-anchor="middle" font-size="26" font-weight="700" fill="${open?'#fff':'light-dark(#777,#aaa)'}">${read?'✓':k+1}</text>
     <text x="${x}" y="${y+60}" text-anchor="middle" font-size="19" style="fill:light-dark(#3a3024,#e8dcc3)">${open?c.t:'★'+c.need}</text></g>`});
  const [hx,hy]=NODES[cur];if(S.hero.type&&un)svg+=heroSVG(S.hero.type,gearOwned()).replace('<svg ',`<svg x="${hx+(hx<300?40:-110)}" y="${hy-60}" width="72" height="72" `);
  svg+='</svg>';
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">冒险地图</h2><button class="ghost" id="back">← 返回</button></div>
   <p class="muted">${HEROES[S.hero.type]?HEROES[S.hero.type].name:'英雄'}要把字怪抢走的字找回来！做练习得到星星，就能解锁新的章节。你现在有 <b>★${ts}</b>。</p>
   <div class="storywrap">${svg}<div class="card">
    ${nextC?`<h3>下一章：第 ${ST.indexOf(nextC)+1} 章 《${nextC.t}》</h3><div class="meter xp"><i style="width:${Math.round(ts/nextC.need*100)}%"></i></div><p class="note">还差 ★${nextC.need-ts}。每日一练、复习和 PSLE 备考都能得到星星。</p><button class="pri" id="earn">去赚星星</button>`:'<h3>所有章节都解锁了！</h3><p class="note">你完成了整个冒险，真了不起！</p>'}
    <h3 style="margin-top:18px">章节</h3><div class="slist">${ST.map((c,k)=>`<button data-story="${k}" ${ts>=c.need?'':'disabled'}><b>第 ${k+1} 章</b> ${ts>=c.need?esc(c.t):'★'+c.need+' 解锁'}${S.story.read.includes(k)?' ✓':''}</button>`).join('')}</div></div></div>`;
  $('#back').onclick=()=>go('home');if($('#earn'))$('#earn').onclick=()=>go('home');
  app.querySelectorAll('svg [data-story]').forEach(g=>{const o=()=>{const k=+g.dataset.story;if(totalStars()>=ST[k].need)viewChapter(k)};g.addEventListener('click',o);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();o()}})});

function viewChapter(k){
  leaveHash('chapter-'+(k+1));try{speechSynthesis.cancel()}catch(e){}
  const ST=EZ.story,c=ST[k];if(!c||totalStars()<c.need)return viewStory();
  const H=HEROES[S.hero.type]?HEROES[S.hero.type].name:'墨墨',HP=HERO_PY[S.hero.type]||'mò mò';
  const text=c.text.replace(/\{H\}/g,H),pys=c.py.replace(/\{H\}/g,HP).trim().split(/\s+/),ens=c.ens.map(x=>x.replace(/\{H\}/g,H));
  if(!S.story.read.includes(k)){S.story.read.push(k);checkBadges();save()}
  let p=0;const body=text.split('|').map((sen,i)=>`<span class="sen">${[...sen].map(ch=>isHan(ch)?`<ruby>${ch}<rt>${pys[p++]||''}</rt></ruby>`:esc(ch)).join('')}</span>`).join('');
  const q=c.q,qText=q.q.replace(/\{H\}/g,H),done=S.story.quiz.includes(k);const qo=shuffle(q.o.map((o,i)=>({o,en:q.oen[i],ok:i===q.a})));
  const next=ST[k+1],nextOpen=next&&totalStars()>=next.need;
  app.innerHTML=`<div class="stage rd ${S.set.py?'':'nopy'} ${S.set.en?'':'noen'}" id="rd"><div class="topbar"><button class="ghost" id="back">← 冒险地图</button><span class="muted">第 ${k+1} 章 / ${ST.length}</span></div>
   <div class="scenebox">${sceneSVG(c.scene,c.hue)}</div>
   <h2 class="kai" style="margin:14px 0 6px;font-size:30px">第 ${k+1} 章 ${esc(c.t)} <span class="en" style="font-size:16px;font-family:'Noto Sans SC',sans-serif;font-weight:400">${esc(c.en)}</span></h2>
   <div class="row" style="margin-bottom:10px"><button class="tog" id="pyT" aria-pressed="${S.set.py}">拼音</button><button class="tog" id="enT" aria-pressed="${S.set.en}">英文</button>${sayBtn(text.replace(/\|/g,''),'听这一章')}</div>
   <div class="passage kai"><p>${body}</p><div class="en">${ens.map(esc).join(' ')}</div></div>
   <div class="card" style="margin-top:16px"><h3>小问题 <span class="note" style="font-weight:400">${done?'已经答对了 ✓':'第一次答对，英雄得到 20 点经验'}</span></h3>
    <p class="kai" style="font-size:19px;margin:6px 0">${S.set.py?rubyLine(qText):esc(qText)}</p><div class="qen">${esc(q.en.replace(/\{H\}/g,H))}</div>
    <div class="opts psopts">${qo.map((x,j)=>`<button class="opt pso" data-j="${j}">${esc(x.o)}<small class="qen">${esc(x.en)}</small></button>`).join('')}</div><div class="fb" id="sfb"></div></div>
   <div class="row" style="justify-content:space-between;margin-top:16px">${k>0?`<button id="prevC">← 第 ${k} 章</button>`:'<span></span>'}
    ${next?(nextOpen?`<button class="pri" id="nextC">第 ${k+2} 章 →</button>`:`<span class="note">还差 ★${next.need-totalStars()} 解锁第 ${k+2} 章</span>`):'<span class="reward">冒险完成！</span>'}</div></div>`;
  const rd=$('#rd');
  $('#back').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}go('story')};
  $('#pyT').onclick=e=>{const on=rd.classList.toggle('nopy');e.currentTarget.setAttribute('aria-pressed',String(!on));S.set.py=!on;save()};
  $('#enT').onclick=e=>{const on=rd.classList.toggle('noen');e.currentTarget.setAttribute('aria-pressed',String(!on));S.set.en=!on;save()};
  if($('#prevC'))$('#prevC').onclick=()=>viewChapter(k-1);if($('#nextC'))$('#nextC').onclick=()=>viewChapter(k+1);
  app.querySelectorAll('.pso').forEach(b=>b.onclick=()=>{const x=qo[+b.dataset.j];const fb=$('#sfb');
    if(x.ok){app.querySelectorAll('.pso').forEach(y=>y.disabled=true);b.classList.add('ok');fb.className='fb ok';
      if(!S.story.quiz.includes(k)){S.story.quiz.push(k);S.hero.xp+=20;save();chips();fb.textContent='答对了！英雄得到 20 点经验。'}else fb.textContent='答对了！'}
    else{b.classList.add('bad');b.disabled=true;fb.className='fb bad';fb.textContent='再读一读故事，试试别的答案。'}});
  window.scrollTo(0,0);
}

/* ================= battle ================= */
function makeBattle(mon,monId,totalItems,boss){
  if(!S.set.battle||!S.hero.type)return null;
  const L0=monId?LEVELS.find(l=>l.id===monId.split('|')[0]):null;const lvk=L0?L0.k:(monId?9:0);const max=Math.max(20,Math.round(totalItems*10*(.8+.04*lvk)));
  const hit=8+lvk+(boss?3:0);
  return {mon,monId,boss,max,hp:max,hearts:heroHearts(),maxH:heroHearts(),hhp:heroHP(),hmax:heroHP(),hit,combo:0,dodge:gearOwned().includes('cape'),xp:0,won:false,ko:false};
}
function arenaHTML(B){
  return `<div class="arena" id="arena"><div class="bmsg" id="bmsg" aria-live="polite">${B.boss?'大王出现了！':'怪物出现了！'}</div>
   <div class="fighter" id="fh"><div class="body">${heroSVG(S.hero.type,gearOwned())}</div><div class="tag">${HEROES[S.hero.type].name} Lv${heroLv()}</div><div class="hp hhp"><i id="hhpbar" style="width:100%"></i></div><div class="hearts" id="hearts" aria-label="生命"></div></div>
   <div class="vs" id="combo">VS</div>
   <div class="fighter" id="fm"><div class="body">${B.mon.svg}</div><div class="tag">${B.mon.name}</div><div class="hp"><i id="hpbar" style="width:100%"></i></div><div class="note">攻击力 ${B.hit}</div></div></div>`;
}
function drawBattle(B){
  const h=$('#hearts');if(h)h.innerHTML='♥'.repeat(Math.max(0,B.hearts))+`<span class="e">${'♥'.repeat(B.maxH-Math.max(0,B.hearts))}</span>`;
  const hb=$('#hpbar');if(hb)hb.style.width=Math.max(0,B.hp/B.max*100)+'%';
  const hh=$('#hhpbar');if(hh)hh.style.width=Math.max(0,B.hhp/B.hmax*100)+'%';
  const c=$('#combo');if(c)c.textContent=B.combo>=comboAt()?`连击 ×1.5`:'VS';
}
function floatDmg(side,txt,heal){const f=$(side);if(!f)return;const d=document.createElement('span');d.className='dmg'+(heal?' heal':'');d.textContent=txt;f.appendChild(d);setTimeout(()=>d.remove(),950)}
function battleTurn(B,val){
  if(!B)return;const msg=$('#bmsg');
  if(val>0){B.xp+=Math.round(val*10);
    if(B.ko){if(msg)msg.textContent='英雄在休息，答对了也有经验。';return}
    if(val===1)B.combo++;else B.combo=0;
    const mult=B.combo>=comboAt()?1.5:1;const dmg=Math.round(heroAtk()*val*mult);
    if(B.won){if(msg)msg.textContent=`答对了！经验 +${Math.round(val*10)}`;drawBattle(B);return}
    B.hp-=dmg;bump($('#fh .body'),'atkR');setTimeout(()=>{bump($('#fm .body'),'shake');floatDmg('#fm','-'+dmg)},220);
    if(msg)msg.textContent=val<1?`答对了一部分，攻击减弱：-${dmg}`:mult>1?`连击！-${dmg}`:`攻击！-${dmg}`;
    if(B.hp<=0){B.won=true;setTimeout(()=>{$('#fm')?.classList.add('ko');if(msg)msg.textContent=`打败了${B.mon.name}！`},450)}
  }else{B.combo=0;
    if(B.won||B.ko){drawBattle(B);return}
    bump($('#fm .body'),'atkL');
    if(B.dodge){B.dodge=false;if(msg)msg.textContent='飞天披风挡住了攻击！';setTimeout(()=>floatDmg('#fh','挡住'),220)}
    else{B.hhp-=B.hit;const lost=B.hhp<=0;setTimeout(()=>{bump($('#fh .body'),'shake');floatDmg('#fh',lost?'-♥':'-'+B.hit)},220);
      if(lost){B.hearts--;if(B.hearts>0)B.hhp=B.hmax}
      if(msg)msg.textContent=!lost?`${B.mon.name}反击了！体力 -${B.hit}`:B.hearts>0?`体力用完，失去一条命！还剩 ${B.hearts} 条命。`:`${HEROES[S.hero.type].name}累倒了，先休息。继续答题还能拿星星和经验。`;
      if(B.hearts<=0){B.hhp=0;B.ko=true;setTimeout(()=>$('#fh')?.classList.add('ko'),450)}}
  }
  setTimeout(()=>drawBattle(B),250);
}
function endBattle(B,lvBefore,gearBefore){
  if(!B)return '';
  let out='';const bonus=B.won?(B.boss?40:25):0;S.hero.xp+=B.xp+bonus;
  if(B.won&&B.monId&&!S.hero.won.includes(B.monId))S.hero.won.push(B.monId);
  checkBadges();save();chips();
  out+=B.won?`<div class="reward">打败了 <b>${B.mon.name}</b>！经验 +${B.xp+bonus}</div>`:`<div class="reward">${B.mon.name}逃走了。经验 +${B.xp}。下次再来！</div>`;
  const lv=heroLv();const tg=$('#fh .tag');if(tg)tg.textContent=`${HEROES[S.hero.type].name} Lv${lv}`;if(lv>lvBefore)out+=`<div class="reward">${HEROES[S.hero.type].name} 升到 <b>Lv ${lv}</b>！获得 ${lv-lvBefore} 个升级点，到“我的英雄”选择升级。</div>`;
  gearOwned().filter(g=>!gearBefore.includes(g)).forEach(k=>{const g=GEAR.find(x=>x[0]===k);out+=`<div class="reward">新装备：<b>${g[1]}</b>（${g[3]}）</div>`});
  return out;
}

function readItems(lv,i){
  const C=CONTENT[lv],L=C.lessons[i];
  const fills=C.fill.filter(f=>f.l===i).map(f=>({type:'fill',lv,ch:f.a,q:f.q,en:f.en,opts:shuffle(f.o)}));
  const pyItems=shuffle([...L.read]).slice(0,8).map(ch=>pyItem(lv,ch,L.read));
  return shuffle([...pyItems,...fills]);
}
function pyItem(lv,ch,near){
  const C=CONTENT[lv];const okd=c=>c!==ch&&py(c)&&py(c)!==py(ch);
  const all=[...new Set(C.lessons.flatMap(l=>[...l.read]))];
  const ds=[...new Set([...shuffle([...near].filter(okd)).slice(0,2),...shuffle(all.filter(okd))])].slice(0,3);
  return {type:'py',lv,ch,opts:shuffle([ch,...ds])};
}
function grammarItems(lv){return shuffle(CONTENT[lv].grammar).map(g=>{let parts=null;if(g.t==='order'){parts=shuffle(g.parts);let n=0;while(parts.join('')===g.parts.join('')&&n++<20)parts=shuffle(g.parts)}return {type:'g',g,opts:g.t==='pick'?shuffle(g.o):null,parts}})}
function writeItems(lv,i){return [...new Set(CONTENT[lv].lessons[i].write)].map(ch=>({type:'write',lv,ch}))}

function startAct(x){
  if(x.kind==='p')return startReading(x.lv,x.i);

     <div class="fb" id="fb" aria-live="polite" style="text-align:center">按正确的笔顺，一笔一笔写。</div>
     <div class="row" style="justify-content:center"><button id="hint">提示字形</button><button id="anim">看笔顺</button><button class="ghost" id="skip">不会写</button><button class="pri" id="nx" hidden>下一个</button></div>
     <p class="note" style="text-align:center">用了提示，这个字会放进复习本，下次再练。</p>`);
    let mistakes=0,hinted=false,finished=false;const fb=$('#fb');
    const finishChar=(val,msg)=>{if(finished)return;finished=true;done(val,it.ch,it.lv,'w');R.k++;fb.className='fb '+(val>=1?'ok':'bad');fb.textContent=msg;
      ['hint','anim','skip'].forEach(id=>$('#'+id).disabled=true);nextBtn()};
    if(!window.HanziWriter){fb.className='fb bad';fb.textContent='写字工具没有加载成功，请检查网络后再试。';$('#hint').disabled=$('#anim').disabled=true;$('#skip').textContent='跳过';
      $('#skip').onclick=()=>{R.items.splice(R.k,1);R.items.length?(R.k<R.items.length?show():finish()):go(R.back)};return}
    const pad=$('#pad');const size=pad.clientWidth;
    const col=v=>{const t=document.createElement('i');t.style.color=`var(${v})`;pad.appendChild(t);const c=getComputedStyle(t).color;t.remove();return c};
    writer=HanziWriter.create(pad,it.ch,{width:size,height:size,padding:Math.round(size*.06),showOutline:false,showCharacter:false,
      strokeColor:col('--ink'),drawingColor:col('--ink'),outlineColor:col('--grid'),highlightColor:col('--red'),drawingWidth:Math.max(14,size/16),
      charDataLoader:(c,ok,err)=>{import(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/${encodeURIComponent(c)}.json/+esm`).then(m=>ok(m.default)).catch(e=>{fb.className='fb bad';fb.textContent='这个字的笔画资料加载不到，请按“不会写”跳过。';err(e)})}});
    const w=writer;
    const quiz=()=>w.quiz({leniency:1,showHintAfterMisses:3,
      onMistake:()=>{mistakes++;fb.className='fb bad';fb.textContent=mistakes>=3?'这一笔不对。看看提示的位置再写。':'这一笔不对，再试试。'},
      onCorrectStroke:d=>{fb.className='fb';fb.textContent=`第 ${d.strokeNum+1} 笔写对了。`},
      onComplete:()=>{const val=hinted?0:mistakes<=1?1:mistakes<=4?.5:0;
        finishChar(val,val===1?'写对了！':val===.5?`写完了，错了 ${mistakes} 次笔画。这个字放进复习本，下次再练。`:'写完了。这个字放进复习本，下次再练。')}});
    quiz();
    $('#hint').onclick=()=>{hinted=true;w.showOutline()};
    $('#anim').onclick=()=>{hinted=true;w.cancelQuiz();w.animateCharacter({onComplete:()=>{if(!finished&&writer===w){w.hideCharacter();quiz()}}})};
    $('#skip').onclick=()=>{try{w.cancelQuiz();w.showCharacter()}catch(e){}finishChar(0,`这个字是“${it.ch}”（${en(it.ch)}）。已放进复习本。`)};
  }
  function finish(){
    const pct=R.total?(R.base+R.score)/R.total:0;const st=starsOf(pct);
    const badIdx=R.items.map((_,i)=>i).filter(i=>(R.vals[i]||0)<1);
    if(R.id)record(R.id,pct);else{S.log.push({d:today(),a:'review',s:Math.round(pct*100)});checkBadges();save();chips()}
    const rw=endBattle(B,R.lv0,R.g0);
    const help=pct<.6&&(!S.set.py||!S.set.en);
    app.innerHTML=`<div class="stage sum"><h2>${esc(R.title)} · 完成</h2>
     ${R.id?starHtml(st):''}<p style="font-size:20px">答对 ${Math.round(R.score*10)/10} / ${R.items.length}</p>
     ${R.redo?`<p class="muted">改正以后，这个练习的总分是 ${Math.round((R.base+R.score)*10)/10} / ${R.total}。</p>`:''}
     ${storyNews()}
     ${rw?`<div>${rw}</div>`:''}
     ${R.wt.size?`<p class="muted">需要多练习：${[...R.wt].map(esc).join('、')}</p>`:''}
     ${R.items[0]&&R.items[0].type==='g'?'':R.wrong.length?`<p class="muted">这些字放进了复习本：</p><div class="revchars kai">${R.wrong.map(c=>`<span>${c}</span>`).join('')}</div>`:'<p class="muted">全部答对，没有新的字要复习。</p>'}
     ${newBadge?`<p>新徽章：<span class="reward">${BADGES.find(b=>b[0]===newBadge)[1]}</span></p>`:''}
     ${help?`<div class="card" style="text-align:left;margin:14px 0"><b>觉得有点难？</b> 可以打开拼音和英文帮助，再试一次。<div class="row" style="margin-top:8px"><button id="helpOn">打开帮助</button></div></div>`:''}
     <div class="row" style="justify-content:center;margin-top:16px">${badIdx.length?`<button class="pri" id="redo">只做错的题（${badIdx.length}）</button>`:''}<button id="again">再做一次</button><button ${badIdx.length?'':'class="pri"'} id="ret">返回</button></div>
     ${badIdx.length?'<p class="note">只做错的题：答对了可以把分数和星星赢回来。</p>':''}</div>`;
    newBadge=null;
    if(badIdx.length)$('#redo').onclick=()=>{const keep=R.items.reduce((a,_,i)=>a+(badIdx.includes(i)?0:(R.vals[i]||0)),0);
      run({title:R.title.replace(/ · 改正错题$/,'')+' · 改正错题',items:badIdx.map(i=>refreshItem(R.items[i])),id:R.id,back:R.back,mon:R.mon,monId:R.monId,base:R.base+keep,total:R.total,again:R.again,redo:true})};
    if(help)$('#helpOn').onclick=e=>{S.set.py=true;S.set.en=true;save();e.target.textContent='已打开';e.target.disabled=true};
    $('#again').onclick=()=>{R.again?R.again():R.id&&CONTENT[R.id.split('|')[0]]?startAct(actList(R.id.split('|')[0]).find(x=>x.id===R.id)):startReview()};
    $('#ret').onclick=()=>go(R.back);
  }
  show();
}

/* ================= reading ================= */
function passageHTML(p){
  const pys=p.py.split(/\s+/);const n=[...p.text].filter(isHan).length;const useRuby=pys.length===n;let k=0,si=0;
  return p.text.split('\n').map(par=>{const ens=[];const body=par.split('|').map(sen=>{const idx=si++;ens.push(p.ens[idx]||'');
      return `<span class="sen" data-s="${idx}">`+[...sen].map(c=>{if(!isHan(c))return esc(c);const pp=useRuby?pys[k++]:py(c);return `<ruby data-c="${c}" data-p="${pp}">${c}<rt>${pp}</rt></ruby>`}).join('')+'</span>'}).join('');
    return `<p>${body}</p><div class="en">${ens.map(esc).join(' ')}</div>`}).join('');
}
const sentences=p=>p.text.replace(/\n/g,'|').split('|');
function normalise(s){return s.replace(/[\s，。！？、,.!?“”"'‘’：:；;（）()]/g,'')}
function startReading(lv,i,prev){
  leaveHash();
  const locked=j=>!!(prev&&prev.vals[j]===1);
  const p=CONTENT[lv].passages[i],id=`${lv}|p${i}`;const lv0=heroLv(),g0=gearOwned();
  const scored=p.qs.filter(q=>q.t!=='self').length;
  const B=makeBattle(bossFor(lv,i),`${lv}|p${i}`,scored,true);
  app.innerHTML=`<div class="stage rd ${S.set.py?'':'nopy'} ${S.set.en?'':'noen'}" id="rd"><div class="topbar"><button class="ghost" id="quit">← 退出</button><span class="muted">${lvName(lv)} · 阅读 ${i+1}</span></div>
   ${B?arenaHTML(B):''}
   <h2 class="kai" style="margin-top:14px;font-size:30px">${esc(p.title)} <span class="en" style="font-size:16px;font-family:'Noto Sans SC',sans-serif;font-weight:400">${esc(p.en)}</span></h2>
   <div class="row" style="margin-bottom:10px"><button class="tog" id="pyT" aria-pressed="${S.set.py}">拼音</button><button class="tog" id="enT" aria-pressed="${S.set.en}">英文</button>${sayBtn(p.text.replace(/[|\n]/g,''),'听全文')}</div>
   <p class="note" style="margin-top:0">不认识的字，点一下就能看拼音、意思，还能听读音。</p>
   <div class="passage kai" id="ps">${passageHTML(p)}</div>
   <div class="wordcard" id="wc" hidden></div>
   <p class="muted" style="margin-top:20px">读完短文，回答问题。写的答案请用汉语拼音输入法打中文，写完整的句子。</p>
   <form id="rf">${p.qs.map((q,j)=>`<div class="rq" data-j="${j}"><div><span class="n">${j+1}.</span><span class="kai" style="font-size:19px">${esc(q.q)}</span>${q.t==='tf'?'<span class="muted">（对还是错？）</span>':''} ${sayBtn(q.q,'听')}</div><div class="qen">${esc(q.en)}</div>
    ${q.t==='mc'?`<div class="opts">${q.o.map((o,k)=>`<label class="o"><input type="radio" name="q${j}" value="${k}"><span>${esc(o)}<small class="qen">${esc(q.oen[k])}</small></span></label>`).join('')}</div>`
     :q.t==='tf'?`<div class="opts"><label class="o"><input type="radio" name="q${j}" value="1">对 <small class="qen">true</small></label><label class="o"><input type="radio" name="q${j}" value="0">错 <small class="qen">false</small></label></div>`
     :`<textarea name="q${j}" rows="2" style="margin-top:8px" placeholder="在这里写答案（用中文）"></textarea>`}
    <div class="res"></div></div>`).join('')}
   <div class="row" style="margin-top:16px"><button class="pri" id="sub">交卷${B?'，发动攻击':''}</button><span class="note" id="subm"></span></div></form><div id="rw"></div></div>`;
  if(B)drawBattle(B);
  const rd=$('#rd');
  if(prev)p.qs.forEach((q,j)=>{if(!locked(j))return;const box=app.querySelector(`.rq[data-j="${j}"]`);
    box.querySelectorAll('input[type=radio]').forEach(x=>{x.checked=x.value===prev.ans[j];x.disabled=true});const ta=box.querySelector('textarea');if(ta){ta.value=prev.ans[j]||'';ta.disabled=true}
    box.querySelector('.res').innerHTML='<div class="mark ok">✓ 上次已答对</div>'});
  if(prev)$('#subm').textContent='上次答对的题已经锁好了，只要改错的题。';
  $('#quit').onclick=()=>go('level-'+lv.toLowerCase());
  $('#pyT').onclick=e=>{const on=rd.classList.toggle('nopy');e.currentTarget.setAttribute('aria-pressed',String(!on));S.set.py=!on;save()};
  $('#enT').onclick=e=>{const on=rd.classList.toggle('noen');e.currentTarget.setAttribute('aria-pressed',String(!on));S.set.en=!on;save()};
  const sens=sentences(p);
  $('#ps').onclick=e=>{const r=e.target.closest('ruby');if(!r)return;const s=r.closest('.sen');
    app.querySelectorAll('#ps .on,#ps .sel').forEach(x=>x.classList.remove('on','sel'));r.classList.add('sel');s.classList.add('on');
    const c=r.dataset.c,si=+s.dataset.s;const wc=$('#wc');wc.hidden=false;
    wc.innerHTML=`<div class="c kai">${c}</div><div class="p">${r.dataset.p}</div><div>${esc(en(c))||'<span class="note">（没有收录这个字的意思）</span>'}</div>
      <div class="row">${sayBtn(c,'听这个字')}${sayBtn(sens[si],'听这一句')}<button class="say" type="button" id="wcx">关闭</button></div>
      <div style="grid-column:1/-1" class="note">这一句：${esc(p.ens[si]||'')}</div>`;
    $('#wcx').onclick=()=>{wc.hidden=true;app.querySelectorAll('#ps .on,#ps .sel').forEach(x=>x.classList.remove('on','sel'))};
    say(c)};
  $('#rf').onsubmit=e=>{e.preventDefault();
    const fd=new FormData(e.target);
    const empty=p.qs.filter((q,j)=>!locked(j)&&!String(fd.get('q'+j)||'').trim()).length;const ans={},vq={};
    if(empty&&!e.target.dataset.warned){e.target.dataset.warned=1;$('#subm').textContent=`还有 ${empty} 题没有回答。再按一次就会交卷。`;return}
    let got=0,tot=0;const vals=[];
    p.qs.forEach((q,j)=>{const box=app.querySelector(`.rq[data-j="${j}"] .res`);const v=String(fd.get('q'+j)||'');
      if(locked(j)){tot++;got++;vq[j]=1;ans[j]=prev.ans[j];return}ans[j]=v;
      if(q.t==='mc'||q.t==='tf'){tot++;const right=q.t==='mc'?String(q.a):(q.a?'1':'0');const ok=v===right;if(ok)got++;vals.push(ok?1:0);vq[j]=ok?1:0;
        box.innerHTML=`<div class="mark ${ok?'ok':'bad'}">${ok?'✓ 答对了':'✗ 正确答案：'+esc(q.t==='mc'?q.o[q.a]:(q.a?'对':'错'))}</div>`}
      else if(q.t==='open'){tot++;const a=normalise(v);const hits=q.keys.map(g=>!!a&&g.some(k=>a.includes(k)));const sc=hits.filter(Boolean).length/q.keys.length;got+=sc;vals.push(sc);vq[j]=sc;
        box.innerHTML=`<div class="mark ${sc===1?'ok':sc>0?'part':'bad'}">${q.pts.map((t,k)=>`${hits[k]?'✓':'✗'} ${esc(t)}`).join('　')}<div class="model">参考答案：${esc(q.model)}</div></div>`}
      else{box.innerHTML=`<div class="mark part">自己检查：和参考答案比一比，勾出你做到的。<div class="model">参考答案：${esc(q.model)}</div>${q.pts.map(t=>`<label class="o" style="margin-top:6px"><input type="checkbox"> ${esc(t)}</label>`).join('')}<div class="note">这一题不算分。</div></div>`}
    });
    e.target.querySelectorAll('input[type=radio],textarea').forEach(x=>x.disabled=true);
    const pct=tot?got/tot:0;record(id,pct);
    const sub=$('#sub');sub.disabled=true;
    const fin=()=>{const rw=endBattle(B,lv0,g0);sub.disabled=false;sub.textContent='完成，返回';sub.type='button';sub.onclick=()=>go('level-'+lv.toLowerCase());
      $('#subm').innerHTML=`得分 ${Math.round(got*10)/10} / ${tot}　${starHtml(starsOf(pct))}`;
      const bad=Object.keys(vq).filter(j=>vq[j]<1).length;
      $('#rw').innerHTML=`<div style="margin-top:12px">${rw}${storyNews()}${newBadge?`<div class="reward">新徽章：${BADGES.find(b=>b[0]===newBadge)[1]}</div>`:''}${bad?`<div class="row" style="margin-top:10px"><button class="pri" id="redo">只改错的题（${bad}）</button><span class="note">答对了可以把分数赢回来。</span></div>`:''}</div>`;newBadge=null;
      if(bad)$('#redo').onclick=()=>startReading(lv,i,{vals:vq,ans})};
    if(B){$('#arena').scrollIntoView({behavior:'smooth',block:'center'});vals.forEach((v,k)=>setTimeout(()=>battleTurn(B,v),400+k*800));setTimeout(()=>{fin();sub.scrollIntoView({behavior:'smooth',block:'center'})},600+vals.length*800)}
    else{fin();sub.scrollIntoView({behavior:'smooth',block:'center'})}
  };
}

chips();render();
}
</script>
<script>
document.getElementById('brandHome').addEventListener('click',()=>go('home'));
window.addEventListener('pageshow',e=>{if(e.persisted||!document.getElementById('app').children.length)render()});
window.addEventListener('error',()=>{const a=document.getElementById('app');if(a&&!a.children.length)setTimeout(render,0)});
</script>
